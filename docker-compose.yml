services:
  app-aula:
    build:
      context: .
      args:
        # Defina no Portainer (Stack > Environment variables) ou num .env local
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?defina VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?defina VITE_SUPABASE_ANON_KEY}
    container_name: aula-pratica-nuvem
    restart: always
    environment:
      - PORT=8080
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
