services:
  mini-football:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: mini-football
    restart: always
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true